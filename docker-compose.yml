services:
  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq-example
    ports:
      - "5672:5672"   # AMQP: aquí se conectan Producer y Consumer
      - "15672:15672" # Interfaz web de administración (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      # La imagen rabbitmq:latest no trae la UI de administración activada;
      # este archivo habilita el plugin rabbitmq_management al arrancar.
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
